<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>General Knowledge Quiz</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
     <div class="container">

        <div class="screen active" id="start-screen">
            <h1>Quiz Time!</h1>
            <p>How good is your general knowledge?</p>
            <button id="start-btn">Start Quiz</button>
        </div>
        
        <div class="screen" id="quiz-screen"> 
            <div class="quiz-header">
                <h2 id="question-text">Question goes here</h2>
                <div class="quiz-info">
                    <p>Question <span id="current-question">1</span> of <span id="total-questions">5</span></p>
                    <p>Score: <span id="score">0</span></p>
                </div>
            </div>

        <div id="answer-container" class="answer-container">
                <!--Answer button will be inserted here from my js code later at some point-->
        </div>
    <div class="progress">
    <div class="progress-bar" id="progress-bar"></div>
    </div>
</div>

    <div class="screen" id="results-screen">
        <h1>Quiz Results</h1>
    <div class="result-info">
        <p>You scored <span id="final-score">0</span> out of <span id="max-score"></span></p>
    <div id="result-message">Good Job!</div>
    </div>
    <button id="restart-btn">Restart Quiz</button>
    </div>

</div>

<script src="script.js"></script>

    </body>
</html>
